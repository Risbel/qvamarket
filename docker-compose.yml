services:
  postgres:
    image: postgres:17-alpine
    container_name: qvashop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qvashop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qvashop}
      POSTGRES_DB: ${POSTGRES_DB:-qvashop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qvashop} -d ${POSTGRES_DB:-qvashop}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
