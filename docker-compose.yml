services:
  postgres:
    image: postgres:17-alpine
    container_name: qvashop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qvashop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qvashop}
      POSTGRES_DB: ${POSTGRES_DB:-qvashop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qvashop} -d ${POSTGRES_DB:-qvashop}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for product images, logos, ... (CLAUDE.md > Stack).
  # MinIO's official images are no longer published, so we use SeaweedFS (Apache 2.0).
  # Anonymous identity = public read (images are served straight from the bucket);
  # writes need the access key. The identities file is generated from env at start.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: qvashop-s3
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-qvashop-access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-qvashop-secret-change-me}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<EOF
        {"identities":[
          {"name":"qvashop","credentials":[{"accessKey":"${S3_ACCESS_KEY}","secretKey":"${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]},
          {"name":"anonymous","actions":["Read"]}
        ]}
        EOF
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data

volumes:
  postgres_data:
  seaweedfs_data:
